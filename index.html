<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구의 운동 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#CFE6F2; --paper:#FDFEFE; --soft:#EAF4FA; --line:#B9D3E6; --ink:#1E2A3A; --muted:#55657A;
  --pri:#2B7FBF; --pri-d:#1F5F92; --good:#2E8B57; --bad:#D9483B;
  --c0:#E0453A; --c1:#2B7FBF; --c2:#E3A21A; --c3:#2E8B57;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
.hd{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--paper);border-bottom:3px solid #5E93BF}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8FC8F0,#2B7FBF 60%,#1E4F7A);box-shadow:inset -6px -3px 0 rgba(0,0,0,.25)}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.dot b{width:10px;height:10px;border-radius:50%;background:#B0B8C2}
.dot.on b{background:var(--good)} .dot.off b{background:var(--bad)}
main{flex:1;display:flex;flex-direction:column;padding:20px;gap:18px;max-width:1500px;width:100%;margin:0 auto}
.card{background:var(--paper);border:3px solid #5E93BF;border-radius:var(--r);padding:22px}
.btn{background:var(--pri);color:#fff;font-weight:700;font-size:20px;padding:14px 26px;border-radius:14px;box-shadow:0 4px 0 var(--pri-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri-d)}
.btn:disabled{background:#9DB3C4;box-shadow:0 4px 0 #7D93A4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--pri-d);box-shadow:0 4px 0 var(--line)}
.btn.sm{font-size:15px;padding:8px 14px;box-shadow:0 3px 0 var(--line)}
.muted{color:var(--muted)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;flex:1}
input.name{font:inherit;font-size:24px;padding:14px 16px;border:3px solid var(--line);border-radius:14px;width:100%;max-width:340px;text-align:center;background:#fff;color:var(--ink)}
input.name:focus{outline:none;border-color:var(--pri)}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:16px;background:var(--soft);color:var(--pri-d)}
.lv-하{background:#E3F2E8;color:#1F6B42}.lv-중{background:#FFF1D6;color:#8A5A00}.lv-상{background:#FDE4E1;color:#A3312A}

/* host lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;flex:1}
.join-url{font-size:clamp(22px,2.6vw,38px);font-weight:900;color:var(--pri-d);word-break:break-all}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;border:2px solid var(--line)}
#qr img,#qr canvas{display:block;width:240px;height:240px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:700;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* host question */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtext{font-size:clamp(26px,3vw,44px);font-weight:900;line-height:1.35}
.qbody{display:flex;gap:18px;flex:1;min-height:0}
.qbody .fig{flex:0 0 auto;max-width:46%;display:flex;align-items:center}
.qbody .fig img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;border:2px solid var(--line);background:#fff}
.timer{margin-left:auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--pri-d);background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--soft) 0);position:relative}
.timer::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--paper)}
.timer span{position:relative}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:14px;color:#fff;border-radius:16px;padding:18px 20px;font-size:clamp(20px,2.1vw,30px);font-weight:700;min-height:86px;position:relative;overflow:hidden}
.opt .sh{font-size:1.2em;width:1.4em;text-align:center;flex:none}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2)}.o3{background:var(--c3)}
.opt.dim{opacity:.32}
.opt.right{outline:6px solid var(--ink);outline-offset:-6px}
.opt .cnt{margin-left:auto;font-size:.9em;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 14px;flex:none}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:rgba(255,255,255,.75)}
.foot{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.big-num{font-size:30px;font-weight:900}

/* reveal */
.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;flex:1}
.expl img{width:100%;max-height:36vh;object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#fff}
.expl p{font-size:20px;line-height:1.55;margin-top:10px}
.board{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:21px;font-weight:700}
.board li .rk{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.board li .sc{margin-left:auto;color:var(--pri-d)}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:10px}
.pd{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(240px,28vw)}
.pd .nm{font-size:clamp(20px,2.4vw,32px);font-weight:900;text-align:center;word-break:break-all}
.pd .sc{font-size:20px;color:var(--muted);font-weight:700}
.pd .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;color:#fff;font-size:48px}
.p1 .blk{height:220px;background:#E3A21A}.p2 .blk{height:160px;background:#8FA3B8}.p3 .blk{height:120px;background:#C07A3E}

/* player */
.pl-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:60vh}
.pl-opts.ox{grid-template-columns:1fr 1fr}
.pl-opts button{border-radius:20px;color:#fff;font-size:min(16vw,92px);display:grid;place-items:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.pl-opts button:active{transform:scale(.97)}
.pl-opts button small{display:block;font-size:20px;font-weight:700;margin-top:-6px}
.res{font-size:min(14vw,64px)}
.pts{font-size:28px;font-weight:900}
.pin{display:flex;gap:10px;justify-content:center}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.hide{display:none!important}

@media (max-width:900px){
  .lobby,.rev{grid-template-columns:1fr}
  .qbody{flex-direction:column}
  .qbody .fig{max-width:100%}
  .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand hd"><i></i>지구의 운동 퀴즈</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="dot" id="conn"><b></b><span>연결 중</span></span>
      <span id="topBtns"></span>
    </div>
  </div>
  <main id="view"><div class="center"><p class="muted">불러오는 중…</p></div></main>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== 문제 (6학년 1학기 4. 지구의 운동) ===== */
const Q=[
 {lv:"하",t:20,type:"ox",q:"낮과 밤은 태양이 지구 주위를 하루에 한 바퀴 돌기 때문에 생긴다.",o:["O","X"],a:1,ex:"지구가 하루에 한 바퀴 자전해서 태양을 향한 쪽은 낮, 반대쪽은 밤이 돼요."},
 {lv:"중",t:30,q:"그림은 막대를 세운 방위판을 위에서 본 모습이에요. 아침에 생기는 그림자는?",img:"img/q2.jpg",o:["A","B","C","D"],a:0,ex:"그림자는 태양 반대쪽에 생겨요. 아침에는 해가 동쪽에 낮게 떠서 그림자가 서쪽으로 길게 생겨요. B는 점심(가장 짧음), C는 저녁이에요. D처럼 남쪽으로 생기는 그림자는 우리나라에서 볼 수 없어요."},
 {lv:"상",t:60,q:"4월 밤 9시에 남쪽 하늘에서 사자자리를 보았어요. 7월 밤 9시에 사자자리는 어디에서 보일까?",o:["동쪽 하늘","남쪽 하늘 그대로","서쪽 하늘","북쪽 하늘"],a:2,ex:"지구가 공전하기 때문에 같은 시각에 보면 별자리는 조금씩 서쪽으로 옮겨 가요(한 달에 약 2시간만큼). 그래서 봄에 남쪽에 있던 사자자리는 여름 같은 시각에 서쪽 하늘에 있어요."},
 {lv:"하",t:20,q:"다음 중 여름철 대표 별자리는?",o:["오리온자리","백조자리","페가수스자리","사자자리"],a:1,ex:"여름철 대표 별자리는 백조·거문고·독수리자리예요. 오리온자리는 겨울, 페가수스자리는 가을, 사자자리는 봄 별자리예요."},
 {lv:"중",t:30,q:"낮과 밤이 생기는 까닭과 계절별 별자리가 바뀌는 까닭을 바르게 짝지은 것은?",o:["자전 / 공전","공전 / 자전","자전 / 자전","공전 / 공전"],a:0,ex:"하루마다 반복되는 건 하루 주기인 자전, 계절마다 바뀌는 건 1년 주기인 공전이에요."},
 {lv:"상",t:60,q:"북극 위에서 지구를 내려다보면 태양은 오른쪽에 있어요. 지구 맨 위(12시 방향)에 있는 사람은 지금 언제일까?",img:"img/q6.svg",o:["해 뜰 무렵","한낮","해 질 무렵","한밤중"],a:2,ex:"오른쪽 반이 낮, 왼쪽 반이 밤이고, 12시 방향은 그 경계예요. 북극 위에서 보면 지구는 시계 반대 방향으로 돌아서 12시 방향의 사람은 밤 쪽으로 넘어가요. 그래서 해 질 무렵이에요."},
 {lv:"하",t:20,type:"ox",q:"하루 동안 태양은 동쪽에서 서쪽으로 움직여 보이지만, 밤하늘의 별은 제자리에 가만히 있다.",o:["O","X"],a:1,ex:"별도 태양처럼 동쪽 → 남쪽 → 서쪽으로 움직여 보여요. 원인도 똑같이 지구의 자전이에요."},
 {lv:"중",t:30,q:"우리나라가 밤 12시일 때, 지구 정반대편에 있는 나라는?",o:["똑같이 밤 12시","해 뜰 무렵","한낮","해 질 무렵"],a:2,ex:"지구는 언제나 절반은 낮, 절반은 밤이에요. 다른 나라 월드컵 경기를 새벽에 생중계로 보는 것도 이 때문이에요."},
 {lv:"상",t:60,q:"10월 낮 12시, 태양과 같은 방향에 있어서 볼 수 없는 별자리는?",o:["처녀자리","페가수스자리","오리온자리","백조자리"],a:0,ex:"가을 밤 12시에는 태양 반대쪽에 가을 별자리가 보여요. 낮에 태양이 있는 쪽은 그 반대인 봄 별자리 방향이라, 봄 별자리인 처녀자리가 햇빛에 가려 보이지 않아요."},
 {lv:"중",t:30,q:"하루 동안 태양이 동쪽에서 서쪽으로 움직이는 것처럼 보이는 까닭은?",o:["태양이 지구 둘레를 돌아서","지구가 서쪽에서 동쪽으로 자전해서","지구가 태양 둘레를 공전해서","태양이 동쪽에서 서쪽으로 날아가서"],a:1,ex:"실제로 움직이는 건 지구예요. 지구가 서쪽에서 동쪽으로 도니까 태양은 반대로 움직이는 것처럼 보여요."}
];
Q.forEach((q,i)=>q.expl="img/expl"+(i+1)+".jpg");
const SH=["▲","◆","●","■"];
const OXC=[1,0]; // O는 파랑, X는 빨강

/* ===== 저장소 (Firebase Realtime Database, REST + 실시간 스트림) ===== */
const CFG=window.QUIZ_CONFIG||{};
const BASE=String(CFG.firebaseUrl||"").replace(/\/+$/,"")+"/classes/"+encodeURIComponent(CFG.roomKey||"")+"/quiz";
let tree=null, es=null, online=false;

function setAt(obj,parts,val){
  if(!parts.length) return val;
  obj=(obj&&typeof obj==="object")?obj:{};
  const [k,...rest]=parts; const v=setAt(obj[k],rest,val);
  if(v===null||v===undefined) delete obj[k]; else obj[k]=v;
  return Object.keys(obj).length?obj:null;
}
function applyEvent(kind,msg){
  const parts=String(msg.path||"/").split("/").filter(Boolean);
  if(kind==="put") tree=setAt(tree,parts,msg.data);
  else if(kind==="patch"&&msg.data) for(const k in msg.data) tree=setAt(tree,parts.concat(k.split("/").filter(Boolean)),msg.data[k]);
  if(!tree) tree={};
  schedule();
}
function connect(){
  if(es) try{es.close()}catch(e){}
  es=new EventSource(BASE+".json");
  const ok=()=>{ if(!online){online=true;showConn()} };
  es.addEventListener("put",e=>{ok();applyEvent("put",JSON.parse(e.data))});
  es.addEventListener("patch",e=>{ok();applyEvent("patch",JSON.parse(e.data))});
  es.addEventListener("keep-alive",ok);
  es.addEventListener("cancel",()=>{online=false;showConn("저장소 권한 오류")});
  es.onerror=()=>{online=false;showConn()};
}
function showConn(msg){
  const c=document.getElementById("conn");
  c.className="dot "+(online?"on":"off");
  c.querySelector("span").textContent=msg||(online?"연결됨":"다시 연결 중…");
}
async function fbWrite(method,path,body){
  const r=await fetch(BASE+path+".json",{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("저장 실패 "+r.status);
  return r;
}

/* ===== 공통 ===== */
const view=document.getElementById("view");
const topBtns=document.getElementById("topBtns");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
let raf=0; function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;render()}); }

function S(){ return (tree&&tree.state)||null }
function playersOf(run){ const p=tree&&tree.players&&tree.players[run]; return p?Object.keys(p).map(id=>({id,name:p[id].name||"?"})):[] }
function answersOf(run,qi){ const a=tree&&tree.answers&&tree.answers[run]&&tree.answers[run][qi]; return a||{} }
function pts(qi,a){ if(!a||a.c!==Q[qi].a) return 0; const r=Math.min(1,Math.max(0,(a.t||0)/(Q[qi].t*1000))); return Math.round(1000-500*r) }
function standings(run,upto){
  return playersOf(run).map(p=>{let s=0;for(let i=0;i<=upto;i++) s+=pts(i,answersOf(run,i)[p.id]);return{...p,s}})
    .sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name,"ko"));
}
function rankOf(list,id){ const i=list.findIndex(x=>x.id===id); if(i<0) return 0; let r=i; while(r>0&&list[r-1].s===list[i].s) r--; return r+1 }
function optColor(q,i){ return q.type==="ox"?OXC[i]:i }
function optShape(q,i){ return q.type==="ox"?q.o[i]:SH[i] }

/* ===== 역할 ===== */
const isHostUrl=/[?&#]host\b/.test(location.search+location.hash);
let isHost=isHostUrl&&ss.get("eq_host")==="1";
let pinErr="";

/* ===== 진행자 ===== */
let hostTick=0, autoLock="";
function joinUrl(){ return location.origin+location.pathname.replace(/index\.html$/,"") }

function hostRender(){
  const st=S();
  topBtns.innerHTML=st?'<button class="btn sm ghost" id="hNew">새 게임</button>':"";
  const nb=document.getElementById("hNew"); if(nb) nb.onclick=()=>{ if(confirm("참가자와 점수를 모두 지우고 새 게임을 열까요?")) newGame() };
  if(!st){ view.innerHTML='<div class="center"><h1 class="hd" style="font-size:48px">지구의 운동 퀴즈</h1><p class="muted">아직 열린 게임이 없어요.</p><button class="btn" id="hOpen">게임 열기</button></div>'; document.getElementById("hOpen").onclick=newGame; return }
  const run=st.run, pl=playersOf(run);
  if(st.phase==="lobby"){
    view.innerHTML=`<div class="lobby">
      <div class="card center" style="gap:14px">
        <span class="tag">6학년 1학기 · 4. 지구의 운동</span>
        <h1 class="hd" style="font-size:clamp(36px,4.4vw,64px)">휴대폰으로 들어오세요</h1>
        <div id="qr"></div>
        <div class="join-url">${esc(joinUrl().replace(/^https?:\/\//,""))}</div>
        <p class="muted">이름을 넣고 기다리면 문제가 시작돼요.</p>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <div class="foot"><h2 class="hd" style="font-size:32px">참가자 <span style="color:var(--pri)">${pl.length}</span>명</h2>
          <button class="btn" id="hStart" ${pl.length?"":"disabled"}>퀴즈 시작 ▶</button></div>
        <div class="chips">${pl.length?pl.map(p=>`<span class="chip">${esc(p.name)}</span>`).join(""):'<p class="muted">아직 아무도 없어요.</p>'}</div>
      </div></div>`;
    const qr=document.getElementById("qr");
    if(window.QRCode) new QRCode(qr,{text:joinUrl(),width:240,height:240,correctLevel:QRCode.CorrectLevel.M}); else qr.classList.add("hide");
    document.getElementById("hStart").onclick=()=>goQuestion(0);
    return;
  }
  if(st.phase==="question"||st.phase==="reveal"){
    const qi=st.q, q=Q[qi], ans=answersOf(run,qi), nAns=Object.keys(ans).filter(id=>pl.some(p=>p.id===id)).length;
    const rev=st.phase==="reveal";
    const counts=q.o.map((_,i)=>Object.values(ans).filter(a=>a.c===i).length);
    const maxC=Math.max(1,...counts);
    const opts=`<div class="opts">${q.o.map((o,i)=>`<div class="opt o${optColor(q,i)} ${rev?(i===q.a?"right":"dim"):""}">
        <span class="sh">${q.type==="ox"?"":SH[i]}</span><span>${esc(o)}</span>
        ${rev?`<span class="cnt">${counts[i]}명</span><span class="bar" style="width:${counts[i]/maxC*100}%"></span>`:""}</div>`).join("")}</div>`;
    const head=`<div class="qhead"><span class="tag">문제 ${qi+1} / ${Q.length}</span><span class="tag lv-${q.lv}">${q.lv}</span>
        ${rev?"":`<div class="timer" id="hTimer" style="--p:100"><span>${q.t}</span></div>`}</div>`;
    if(!rev){
      view.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:18px;flex:1">${head}
        <div class="qbody">${q.img?`<div class="fig"><img src="${q.img}" alt=""></div>`:""}
          <div style="flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center"><div class="qtext">${esc(q.q)}</div>${opts}</div></div>
        <div class="foot"><span class="big-num">답한 사람 <span style="color:var(--pri)">${nAns}</span> / ${pl.length}</span>
          <button class="btn" id="hReveal">정답 공개</button></div></div>`;
      document.getElementById("hReveal").onclick=reveal;
      tickHost();
    } else {
      const list=standings(run,qi).slice(0,5);
      view.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:14px">${head}<div class="qtext" style="font-size:clamp(22px,2.2vw,32px)">${esc(q.q)}</div>${opts}</div>
        <div class="rev">
          <div class="card expl"><h2 class="hd" style="font-size:28px;color:var(--pri)">해설 · 정답 ${esc(q.o[q.a])}</h2><img src="${q.expl}" alt="해설 그림" style="margin-top:10px"><p>${esc(q.ex)}</p></div>
          <div class="card" style="display:flex;flex-direction:column;gap:14px">
            <h2 class="hd" style="font-size:28px">지금 순위</h2>
            <ol class="board">${list.map((p,i)=>`<li><span class="rk">${rankOf(list,p.id)}</span>${esc(p.name)}<span class="sc">${p.s.toLocaleString()}점</span></li>`).join("")||'<p class="muted">참가자가 없어요.</p>'}</ol>
            <div style="margin-top:auto;display:flex;justify-content:flex-end"><button class="btn" id="hNext">${qi<Q.length-1?"다음 문제 ▶":"최종 결과 🏆"}</button></div>
          </div></div>`;
      document.getElementById("hNext").onclick=()=> qi<Q.length-1?goQuestion(qi+1):finish();
    }
    return;
  }
  if(st.phase==="end"){
    const list=standings(run,Q.length-1), top=list.slice(0,3);
    const slot=(p,k)=>p?`<div class="pd p${k}"><div class="nm">${esc(p.name)}</div><div class="sc">${p.s.toLocaleString()}점</div><div class="blk">${["","🥇","🥈","🥉"][k]}</div></div>`:`<div class="pd p${k}" style="visibility:hidden"><div class="blk"></div></div>`;
    view.innerHTML=`<div class="card center" style="gap:10px"><h1 class="hd" style="font-size:clamp(36px,4vw,60px)">최종 결과</h1>
      <div class="podium">${slot(top[1],2)}${slot(top[0],1)}${slot(top[2],3)}</div></div>
      <div class="card"><ol class="board">${list.slice(3).map(p=>`<li><span class="rk">${rankOf(list,p.id)}</span>${esc(p.name)}<span class="sc">${p.s.toLocaleString()}점</span></li>`).join("")||'<p class="muted" style="text-align:center">함께해 줘서 고마워요!</p>'}</ol></div>`;
  }
}
function tickHost(){
  const st=S(); if(!isHost||!st||st.phase!=="question") return;
  const q=Q[st.q], left=Math.max(0,q.t*1000-(Date.now()-(st.startedAt||Date.now())));
  const el=document.getElementById("hTimer");
  if(el){ el.style.setProperty("--p",left/(q.t*1000)*100); el.querySelector("span").textContent=Math.ceil(left/1000) }
  const pl=playersOf(st.run), ans=answersOf(st.run,st.q);
  const all=pl.length>0&&pl.every(p=>ans[p.id]);
  const key=st.run+":"+st.q;
  if((left<=0||all)&&autoLock!==key){ autoLock=key; setTimeout(reveal,all?600:0) }
}
async function newGame(){
  const run=String(Date.now());
  await fbWrite("PUT","",{state:{run,phase:"lobby",q:0}});
}
async function goQuestion(i){ await fbWrite("PATCH","/state",{phase:"question",q:i,startedAt:Date.now()}) }
async function reveal(){ const st=S(); if(st&&st.phase==="question") await fbWrite("PATCH","/state",{phase:"reveal"}) }
async function finish(){ await fbWrite("PATCH","/state",{phase:"end"}) }

function pinRender(){
  topBtns.innerHTML="";
  view.innerHTML=`<div class="center"><h1 class="hd" style="font-size:40px">진행자 화면</h1><p class="muted">비밀번호를 넣어 주세요.</p>
    <input class="name" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="비밀번호">
    <div class="err">${esc(pinErr)}</div><button class="btn" id="pinGo">들어가기</button></div>`;
  const go=()=>{ if(document.getElementById("pin").value===String(CFG.hostPin||"")){ ss.set("eq_host","1"); isHost=true; render() } else { pinErr="비밀번호가 달라요."; pinRender() } };
  document.getElementById("pinGo").onclick=go;
  document.getElementById("pin").onkeydown=e=>{ if(e.key==="Enter") go() };
  document.getElementById("pin").focus();
}

/* ===== 참가자 ===== */
let pid=ls.get("eq_pid"); if(!pid){ pid="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); ls.set("eq_pid",pid) }
let joining=false, sending=null, seenAt={}, lastPlayerKey="";

function playerRender(){
  topBtns.innerHTML="";
  const st=S();
  if(!st||!st.run){ view.innerHTML='<div class="center"><div style="font-size:64px">🌏</div><h1 class="hd" style="font-size:34px">아직 퀴즈가 열리지 않았어요</h1><p class="muted">선생님이 게임을 열면 자동으로 바뀌어요.</p></div>'; lastPlayerKey="none"; return }
  const run=st.run, mine=tree.players&&tree.players[run]&&tree.players[run][pid];
  if(!mine){
    if(lastPlayerKey==="join:"+run) return; // 입력 중인 이름 지우지 않기
    lastPlayerKey="join:"+run;
    view.innerHTML=`<div class="center"><div style="font-size:64px">🌏</div><h1 class="hd" style="font-size:38px">지구의 운동 퀴즈</h1>
      <p class="muted">이름(별명)을 넣고 들어가세요.</p>
      <input class="name" id="nm" maxlength="10" autocomplete="off" placeholder="이름" value="${esc(ls.get("eq_name")||"")}">
      <div class="err" id="jErr"></div><button class="btn" id="jGo">들어가기</button></div>`;
    const go=async()=>{
      const v=document.getElementById("nm").value.trim().slice(0,10);
      if(!v){ document.getElementById("jErr").textContent="이름을 넣어 주세요."; return }
      if(st.phase==="end"){ document.getElementById("jErr").textContent="이번 게임은 끝났어요. 다음 게임을 기다려 주세요."; return }
      if(joining) return; joining=true; ls.set("eq_name",v);
      try{ await fbWrite("PUT",`/players/${run}/${pid}`,{name:v}) }catch(e){ document.getElementById("jErr").textContent="연결이 불안정해요. 다시 눌러 주세요." }
      joining=false;
    };
    document.getElementById("jGo").onclick=go;
    document.getElementById("nm").onkeydown=e=>{ if(e.key==="Enter") go() };
    return;
  }
  const name=mine.name;
  if(st.phase==="lobby"){ setP("lobby:"+run,`<div class="center"><div style="font-size:64px">✅</div><h1 class="hd" style="font-size:38px">${esc(name)}, 들어왔어요!</h1><p class="muted">화면에 이름이 보이나요? 곧 시작해요.</p></div>`); return }
  const qi=st.q, q=Q[qi], k=run+":"+qi;
  if(st.phase==="question"){
    if(!seenAt[k]) seenAt[k]=Date.now();
    const my=answersOf(run,qi)[pid];
    const late=Date.now()-seenAt[k]>q.t*1000;
    if(my||sending===k){ setP("sent:"+k,`<div class="center"><div style="font-size:64px">📨</div><h1 class="hd" style="font-size:34px">답을 보냈어요</h1><p class="muted">다른 친구들을 기다리는 중…</p></div>`); return }
    if(late){ setP("late:"+k,`<div class="center"><div style="font-size:64px">⏰</div><h1 class="hd" style="font-size:34px">시간이 끝났어요</h1></div>`); return }
    setP("q:"+k,`<div class="qhead"><span class="tag">문제 ${qi+1} / ${Q.length}</span><span class="tag lv-${q.lv}">${q.lv}</span><span class="muted" style="margin-left:auto">큰 화면의 문제를 보고 골라요</span></div>
      <div class="pl-opts ${q.type==="ox"?"ox":""}">${q.o.map((o,i)=>`<button class="o${optColor(q,i)}" data-i="${i}" aria-label="${esc(o)}">${optShape(q,i)}${q.type==="ox"?"":`<small>${esc(o)}</small>`}</button>`).join("")}</div>`);
    view.querySelectorAll(".pl-opts button").forEach(b=>b.onclick=async()=>{
      if(sending) return; sending=k; render();
      const t=Math.min(q.t*1000,Date.now()-seenAt[k]);
      try{ await fbWrite("PUT",`/answers/${run}/${qi}/${pid}`,{c:+b.dataset.i,t}) }catch(e){ sending=null; lastPlayerKey=""; render(); alert("답을 보내지 못했어요. 다시 눌러 주세요."); return }
      sending=null;
    });
    return;
  }
  if(st.phase==="reveal"){
    const my=answersOf(run,qi)[pid], got=pts(qi,my);
    const list=standings(run,qi), rk=rankOf(list,pid), me=list.find(p=>p.id===pid)||{s:0};
    const ok=my&&my.c===q.a;
    setP("rev:"+k+":"+rk+":"+me.s,`<div class="center" style="background:${ok?"#E3F2E8":"#FDE4E1"};border-radius:20px;padding:20px">
      <div class="res">${ok?"⭕":(my?"❌":"⏰")}</div><h1 class="hd" style="font-size:40px;color:${ok?"var(--good)":"var(--bad)"}">${ok?"정답!":(my?"아쉬워요":"시간 초과")}</h1>
      <div class="pts">+${got.toLocaleString()}점</div>
      <p style="font-size:20px">정답: <b>${esc(q.o[q.a])}</b></p>
      <p class="muted" style="font-size:20px">총 ${me.s.toLocaleString()}점 · ${list.length}명 중 <b>${rk}등</b></p></div>`);
    return;
  }
  if(st.phase==="end"){
    const list=standings(run,Q.length-1), rk=rankOf(list,pid), me=list.find(p=>p.id===pid)||{s:0};
    setP("end:"+run+":"+rk,`<div class="center"><div style="font-size:72px">${["","🥇","🥈","🥉"][rk]||"🎉"}</div><h1 class="hd" style="font-size:40px">${esc(name)}, ${rk}등!</h1>
      <p class="pts">${me.s.toLocaleString()}점</p><p class="muted">함께해 줘서 고마워요.</p></div>`);
  }
}
function setP(key,html){ if(key===lastPlayerKey) return; lastPlayerKey=key; view.innerHTML=html }

/* ===== 시작 ===== */
function render(){
  if(isHostUrl&&!isHost) return pinRender();
  if(tree===null){ return }
  if(isHost) hostRender(); else playerRender();
}
if(!CFG.firebaseUrl||String(CFG.roomKey||"").length<12){
  view.innerHTML='<div class="center"><h1 class="hd" style="font-size:32px">설정이 비어 있어요</h1><p class="muted">config.js에 저장소 주소와 칸 이름(12자 이상)을 넣어 주세요.</p></div>';
} else {
  render(); connect();
  setInterval(()=>{ if(isHost) tickHost(); else if(S()&&S().phase==="question") { const st=S(),k=st.run+":"+st.q; if(seenAt[k]&&Date.now()-seenAt[k]>Q[st.q].t*1000) render() } },250);
}
</script>
