<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구의 운동 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#CFE6F2; --paper:#FDFEFE; --soft:#EAF4FA; --line:#B9D3E6; --ink:#1E2A3A; --muted:#55657A;
  --pri:#2B7FBF; --pri-d:#1F5F92; --good:#2E8B57; --bad:#D9483B;
  --c0:#E0453A; --c1:#2B7FBF; --c2:#E3A21A; --c3:#2E8B57;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
.hd{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--paper);border-bottom:3px solid #5E93BF}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8FC8F0,#2B7FBF 60%,#1E4F7A);box-shadow:inset -6px -3px 0 rgba(0,0,0,.25)}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.dot b{width:10px;height:10px;border-radius:50%;background:#B0B8C2}
.dot.on b{background:var(--good)} .dot.off b{background:var(--bad)}
main{flex:1;display:flex;flex-direction:column;padding:20px;gap:18px;max-width:1500px;width:100%;margin:0 auto}
.card{background:var(--paper);border:3px solid #5E93BF;border-radius:var(--r);padding:22px}
.btn{background:var(--pri);color:#fff;font-weight:700;font-size:20px;padding:14px 26px;border-radius:14px;box-shadow:0 4px 0 var(--pri-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri-d)}
.btn:disabled{background:#9DB3C4;box-shadow:0 4px 0 #7D93A4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--pri-d);box-shadow:0 4px 0 var(--line)}
.btn.sm{font-size:15px;padding:8px 14px;box-shadow:0 3px 0 var(--line)}
.muted{color:var(--muted)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;flex:1}
input.name{font:inherit;font-size:24px;padding:14px 16px;border:3px solid var(--line);border-radius:14px;width:100%;max-width:340px;text-align:center;background:#fff;color:var(--ink)}
input.name:focus{outline:none;border-color:var(--pri)}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:16px;background:var(--soft);color:var(--pri-d)}
.lv-하{background:#E3F2E8;color:#1F6B42}.lv-중{background:#FFF1D6;color:#8A5A00}.lv-상{background:#FDE4E1;color:#A3312A}

/* host lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;flex:1}
.join-url{font-size:clamp(22px,2.6vw,38px);font-weight:900;color:var(--pri-d);word-break:break-all}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;border:2px solid var(--line)}
#qr img,#qr canvas{display:block;width:240px;height:240px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:700;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* host question */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtext{font-size:clamp(26px,3vw,44px);font-weight:900;line-height:1.35}
.qbody{display:flex;gap:18px;flex:1;min-height:0}
.qbody .fig{flex:0 0 auto;max-width:46%;display:flex;align-items:center}
.qbody .fig img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;border:2px solid var(--line);background:#fff}
.timer{margin-left:auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--pri-d);background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--soft) 0);position:relative}
.timer::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--paper)}
.timer span{position:relative}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:14px;color:#fff;border-radius:16px;padding:18px 20px;font-size:clamp(20px,2.1vw,30px);font-weight:700;min-height:86px;position:relative;overflow:hidden}
.opt .sh{font-size:1.2em;width:1.4em;text-align:center;flex:none}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2)}.o3{background:var(--c3)}
.opt.dim{opacity:.32}
.opt.right{outline:6px solid var(--ink);outline-offset:-6px}
.opt .cnt{margin-left:auto;font-size:.9em;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 14px;flex:none}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:rgba(255,255,255,.75)}
.foot{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.big-num{font-size:30px;font-weight:900}

/* reveal */
.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;flex:1}
.expl img{width:100%;max-height:32vh;object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#fff}
.expl p{font-size:20px;line-height:1.55;margin-top:10px}
.board{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:21px;font-weight:700}
.board li .rk{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.board li .sc{margin-left:auto;color:var(--pri-d)}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:10px}
.pd{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(240px,28vw)}
.pd .nm{font-size:clamp(20px,2.4vw,32px);font-weight:900;text-align:center;word-break:break-all}
.pd .sc{font-size:20px;color:var(--muted);font-weight:700}
.pd .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;color:#fff;font-size:48px}
.p1 .blk{height:220px;background:#E3A21A}.p2 .blk{height:160px;background:#8FA3B8}.p3 .blk{height:120px;background:#C07A3E}

/* player */
.pl-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:60vh}
.pl-opts.ox{grid-template-columns:1fr 1fr}
.pl-opts button{border-radius:20px;color:#fff;font-size:min(16vw,92px);display:grid;place-items:center;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.pl-opts button:active{transform:scale(.97)}
.pl-opts button small{display:block;font-size:20px;font-weight:700;margin-top:-6px}
.res{font-size:min(14vw,64px)}
.pts{font-size:28px;font-weight:900}
.pin{display:flex;gap:10px;justify-content:center}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.hide{display:none!important}

/* ===== 애니메이션 ===== */
.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.pop-in{animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.drop-in{animation:dropIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dropIn{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.slide-in{animation:slideIn .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slideIn{from{transform:translateX(-40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.slide-up{animation:slideUp .5s ease-out both}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.row-in{animation:rowIn .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rowIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.type-in{animation:typeIn .5s ease-out both}
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.45)}}
.wiggle{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:none}84%{transform:rotate(-4deg)}88%{transform:rotate(4deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
.bounce-loop{animation:bounceLoop 1.2s ease-in-out infinite;display:inline-block}
@keyframes bounceLoop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.shake{animation:shake .5s ease-in-out}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.spin-in{animation:spinIn .9s cubic-bezier(.2,1.4,.4,1) both;display:inline-block}
@keyframes spinIn{from{transform:rotate(-540deg) scale(0)}to{transform:none}}
.fly{display:inline-block;animation:fly 1.6s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-12px) rotate(8deg)}100%{transform:translate(0,0) rotate(0)}}
.spin-earth{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9FD3F5,#2B7FBF 55%,#1E4F7A);box-shadow:inset -18px -8px 0 rgba(0,0,0,.25);position:relative;overflow:hidden;animation:popIn .6s both}
.spin-earth::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 22px 30px at 30% 40%,#6FBF73 98%,transparent),radial-gradient(ellipse 18px 14px at 70% 65%,#6FBF73 98%,transparent);animation:land 4s linear infinite}
@keyframes land{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.orbit{position:relative;width:150px;height:90px;margin-bottom:-6px}
.orbit .sun{position:absolute;left:55px;top:25px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#FFE27A,#F2B83A);box-shadow:0 0 22px #F7C548}
.orbit .planet{position:absolute;left:67px;top:37px;width:16px;height:16px;border-radius:50%;background:#2B7FBF;animation:orb 3s linear infinite}
@keyframes orb{from{transform:rotate(0) translateX(66px) scaleY(1)}to{transform:rotate(360deg) translateX(66px)}}
.chip{background:hsl(var(--h,200) 80% 92%);border-color:hsl(var(--h,200) 60% 70%);animation:chipIn .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes chipIn{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
.ready{gap:20px}
.big-tag{font-size:26px;padding:8px 20px}
.count{font-family:'Black Han Sans',sans-serif;font-size:clamp(140px,22vw,260px);line-height:1;color:var(--pri);animation:count .9s ease-out both;text-shadow:0 8px 0 rgba(43,127,191,.18)}
@keyframes count{0%{transform:scale(2.2);opacity:0}30%{transform:scale(.9);opacity:1}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.pl-ready{font-size:min(26vw,120px);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.timer.hurry{background:conic-gradient(var(--bad) calc(var(--p)*1%),#FDE4E1 0);color:var(--bad)}
.timer.tock{animation:tock .3s ease-out}
@keyframes tock{40%{transform:scale(1.18)}}
.dots{display:flex;flex-wrap:wrap;gap:6px;flex:1;justify-content:center;max-width:50%}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--pri);animation:chipIn .4s cubic-bezier(.2,1.8,.4,1) both}
.dim-anim{animation:dimOut .5s .2s ease-out both}
@keyframes dimOut{to{opacity:.32;transform:scale(.96)}}
.right-anim{animation:rightIn .7s .2s cubic-bezier(.2,1.6,.4,1) both;outline:6px solid var(--ink);outline-offset:-6px;z-index:1}
@keyframes rightIn{0%{transform:scale(1)}40%{transform:scale(1.07) rotate(-1deg)}70%{transform:scale(.98)}100%{transform:scale(1.03)}}
.opt .check{background:#fff;color:var(--good);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;animation:popIn .5s .5s cubic-bezier(.2,1.8,.4,1) both;flex:none}
.opt .bar{width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.board .up{color:var(--good);font-size:16px;margin-left:6px;animation:popIn .4s 1.8s both}
.pd .blk{transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.3,.4,1) both}
.pd .nm,.pd .sc{animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
.p3 .blk{animation-delay:.3s}.p3 .nm,.p3 .sc{animation-delay:.9s}
.p2 .blk{animation-delay:1.1s}.p2 .nm,.p2 .sc{animation-delay:1.7s}
.p1 .blk{animation-delay:2s}.p1 .nm,.p1 .sc{animation-delay:2.6s}
.p1 .nm{font-size:clamp(26px,3vw,42px);color:#B07800}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pd .blk span{display:inline-block;animation:bounceLoop 1.4s ease-in-out 3s infinite}
.btn-in{animation:btnIn .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes btnIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.pl-opts button.chosen{animation:chosen .45s ease-out both;z-index:1}
@keyframes chosen{30%{transform:scale(.88)}70%{transform:scale(1.08)}100%{transform:scale(1.04)}}
.pl-opts button.faded{opacity:.25;transform:scale(.92);transition:all .3s}
.expl-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;flex:1}
.expl-grid img{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;border:2px solid var(--line);background:#fff}
.ans-big{font-size:clamp(26px,2.6vw,38px);font-weight:900;color:var(--good);margin-bottom:14px}
.ex-text{font-size:clamp(20px,1.9vw,28px);line-height:1.65}
.rtable-wrap{overflow-x:auto}
.rtable{border-collapse:collapse;width:100%;font-size:18px;min-width:900px}
.rtable th,.rtable td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.rtable thead th{background:var(--soft);color:var(--pri-d)}
.rtable tbody tr:nth-child(-n+3) td:first-child{color:#B07800}
.rtable td.nm{font-weight:700;text-align:left}
.rtable td.c-ok{color:var(--good)} .rtable td.c-bad{color:var(--bad);font-weight:700;background:#FDF1EF} .rtable td.c-none{color:#9AA5B1}
.rtable td.wr{text-align:left;color:var(--bad)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

@media (max-width:900px){
  .lobby,.rev,.expl-grid{grid-template-columns:1fr}
  .qbody{flex-direction:column}
  .qbody .fig{max-width:100%}
  .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand hd"><i></i>지구의 운동 퀴즈</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="dot" id="conn"><b></b><span>연결 중</span></span>
      <span id="topBtns"></span>
    </div>
  </div>
  <main id="view"><div class="center"><p class="muted">불러오는 중…</p></div></main>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== 문제 (6학년 1학기 4. 지구의 운동) ===== */
const Q=[
 {lv:"하",t:15,type:"ox",q:"낮과 밤은 태양이 지구 주위를 하루에 한 바퀴 돌기 때문에 생긴다.",o:["O","X"],a:1,ex:"지구가 하루에 한 바퀴 자전해서 태양을 향한 쪽은 낮, 반대쪽은 밤이 돼요."},
 {lv:"중",t:15,q:"그림은 막대를 세운 방위판을 위에서 본 모습이에요. 아침에 생기는 그림자는?",img:"img/q2.jpg",o:["A","B","C","D"],a:0,ex:"그림자는 태양 반대쪽에 생겨요. 아침에는 해가 동쪽에 낮게 떠서 그림자가 서쪽으로 길게 생겨요. B는 점심(가장 짧음), C는 저녁이에요. D처럼 남쪽으로 생기는 그림자는 우리나라에서 볼 수 없어요."},
 {lv:"상",t:15,q:"4월 밤 9시에 남쪽 하늘에서 사자자리를 보았어요. 7월 밤 9시에 사자자리는 어디에서 보일까?",o:["동쪽 하늘","남쪽 하늘 그대로","서쪽 하늘","북쪽 하늘"],a:2,ex:"지구가 공전하기 때문에 같은 시각에 보면 별자리는 조금씩 서쪽으로 옮겨 가요(한 달에 약 2시간만큼). 그래서 봄에 남쪽에 있던 사자자리는 여름 같은 시각에 서쪽 하늘에 있어요."},
 {lv:"하",t:15,q:"다음 중 여름철 대표 별자리는?",o:["오리온자리","백조자리","페가수스자리","사자자리"],a:1,ex:"여름철 대표 별자리는 백조·거문고·독수리자리예요. 오리온자리는 겨울, 페가수스자리는 가을, 사자자리는 봄 별자리예요."},
 {lv:"중",t:15,q:"낮과 밤이 생기는 까닭과 계절별 별자리가 바뀌는 까닭을 바르게 짝지은 것은?",o:["자전 / 공전","공전 / 자전","자전 / 자전","공전 / 공전"],a:0,ex:"하루마다 반복되는 건 하루 주기인 자전, 계절마다 바뀌는 건 1년 주기인 공전이에요."},
 {lv:"상",t:15,q:"북극 위에서 지구를 내려다보면 태양은 오른쪽에 있어요. 지구 맨 위(12시 방향)에 있는 사람은 지금 언제일까?",img:"img/q6.svg",o:["해 뜰 무렵","한낮","해 질 무렵","한밤중"],a:2,ex:"오른쪽 반이 낮, 왼쪽 반이 밤이고, 12시 방향은 그 경계예요. 북극 위에서 보면 지구는 시계 반대 방향으로 돌아서 12시 방향의 사람은 밤 쪽으로 넘어가요. 그래서 해 질 무렵이에요."},
 {lv:"하",t:15,type:"ox",q:"하루 동안 태양은 동쪽에서 서쪽으로 움직여 보이지만, 밤하늘의 별은 제자리에 가만히 있다.",o:["O","X"],a:1,ex:"별도 태양처럼 동쪽 → 남쪽 → 서쪽으로 움직여 보여요. 원인도 똑같이 지구의 자전이에요."},
 {lv:"중",t:15,q:"우리나라가 밤 12시일 때, 지구 정반대편에 있는 나라는?",o:["똑같이 밤 12시","해 뜰 무렵","한낮","해 질 무렵"],a:2,ex:"지구는 언제나 절반은 낮, 절반은 밤이에요. 다른 나라 월드컵 경기를 새벽에 생중계로 보는 것도 이 때문이에요."},

/* ===== 저장소 (Firebase Realtime Database, REST + 실시간 스트림) ===== */
const CFG=window.QUIZ_CONFIG||{};
const BASE=String(CFG.firebaseUrl||"").replace(/\/+$/,"")+"/classes/"+encodeURIComponent(CFG.roomKey||"")+"/quiz";
let tree=null, es=null, online=false;

function setAt(obj,parts,val){
  if(!parts.length) return val;
  obj=(obj&&typeof obj==="object")?obj:{};
  const [k,...rest]=parts; const v=setAt(obj[k],rest,val);
  if(v===null||v===undefined) delete obj[k]; else obj[k]=v;
  return Object.keys(obj).length?obj:null;
}
function applyEvent(kind,msg){
  const parts=String(msg.path||"/").split("/").filter(Boolean);
  if(kind==="put") tree=setAt(tree,parts,msg.data);
  else if(kind==="patch"&&msg.data) for(const k in msg.data) tree=setAt(tree,parts.concat(k.split("/").filter(Boolean)),msg.data[k]);
  if(!tree) tree={};
  schedule();
}
function connect(){
  if(es) try{es.close()}catch(e){}
  es=new EventSource(BASE+".json");
  const ok=()=>{ if(!online){online=true;showConn()} };
  es.addEventListener("put",e=>{ok();applyEvent("put",JSON.parse(e.data))});
  es.addEventListener("patch",e=>{ok();applyEvent("patch",JSON.parse(e.data))});
  es.addEventListener("keep-alive",ok);
  es.addEventListener("cancel",()=>{online=false;showConn("저장소 권한 오류")});
  es.onerror=()=>{online=false;showConn()};
}
function showConn(msg){
  const c=document.getElementById("conn");
  c.className="dot "+(online?"on":"off");
  c.querySelector("span").textContent=msg||(online?"연결됨":"다시 연결 중…");
}
async function fbWrite(method,path,body){
  const r=await fetch(BASE+path+".json",{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("저장 실패 "+r.status);
  return r;
}

function playersOf(run){ const p=tree&&tree.players&&tree.players[run]; return p?Object.keys(p).map(id=>({id,name:p[id].name||"?"})):[] }
function answersOf(run,qi){ const a=tree&&tree.answers&&tree.answers[run]&&tree.answers[run][qi]; return a||{} }
function pts(qi,a){ if(!a||a.c!==Q[qi].a) return 0; const r=Math.min(1,Math.max(0,(a.t||0)/(Q[qi].t*1000))); return Math.round(1000-500*r) }
function standings(run,upto){

}
function rankOf(list,id){ const i=list.findIndex(x=>x.id===id); if(i<0) return 0; let r=i; while(r>0&&list[r-1].s===list[i].s) r--; return r+1 }

let soundOn=ls.get("eq_sound")!=="0", actx=null;
function beep(f,d){ if(!soundOn||!isHost) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
  const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(.0001,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+(d||.1));
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||.1)+.02) }catch(e){} }
function pling(n){ beep(500+Math.min(n,12)*45,.08) }
function restart(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls) }
function bump(el){ restart(el,"bump") }
function countUp(el,to,suf,pre){ const t0=performance.now(), d=900; const f=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=(pre||"")+Math.round(to*e).toLocaleString()+suf; if(k<1) requestAnimationFrame(f) }; requestAnimationFrame(f) }
const FX={cv:null,ctx:null,parts:[],run:false};
const FXCOL=["#E0453A","#2B7FBF","#E3A21A","#2E8B57","#F7C548","#8FC2EC","#B36AE2"];
function fxCanvas(){ if(FX.cv) return; FX.cv=document.createElement("canvas"); FX.cv.className="fx"; document.body.appendChild(FX.cv); FX.ctx=FX.cv.getContext("2d");
  const rs=()=>{ FX.cv.width=innerWidth*devicePixelRatio; FX.cv.height=innerHeight*devicePixelRatio }; rs(); addEventListener("resize",rs) }
function fxLoop(){ if(FX.run) return; FX.run=true; const c=FX.ctx, dpr=devicePixelRatio;
  const f=()=>{ c.clearRect(0,0,FX.cv.width,FX.cv.height);
    FX.parts=FX.parts.filter(p=>p.y<innerHeight+40&&p.life>0);
    for(const p of FX.parts){ p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
      c.save(); c.translate(p.x*dpr,p.y*dpr); c.rotate(p.r); c.fillStyle=p.c; c.globalAlpha=Math.min(1,p.life/40);
      if(p.s==="star"){ c.font=(p.w*2*dpr)+"px sans-serif"; c.fillText("★",-p.w*dpr,p.w*dpr) } else c.fillRect(-p.w*dpr/2,-p.h*dpr/2,p.w*dpr,p.h*dpr); c.restore() }
    if(FX.parts.length) requestAnimationFrame(f); else { FX.run=false; c.clearRect(0,0,FX.cv.width,FX.cv.height) } };
  requestAnimationFrame(f) }
function confetti(x,y,n){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; fxCanvas();
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=4+Math.random()*9;
    FX.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,g:.28,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:FXCOL[i%FXCOL.length],life:160,s:i%9===0?"star":""}) }
  fxLoop() }
function rain(ms){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; fxCanvas(); const end=Date.now()+ms;
  const add=()=>{ for(let i=0;i<6;i++) FX.parts.push({x:Math.random()*innerWidth,y:-20,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,w:7+Math.random()*7,h:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:FXCOL[(Math.random()*FXCOL.length)|0],life:400,s:Math.random()<.12?"star":""});
    fxLoop(); if(Date.now()<end) setTimeout(add,60) }; add() }

function resultData(run){

      if(a.c===q.a) return {k:"ok",short:"⭕",full:"O"};
      return {k:"bad",short:"✗ "+(q.type==="ox"?q.o[a.c]:"①②③④"[a.c]),full:"X (고른 답: "+q.o[a.c]+")",pick:q.o[a.c]} });
    const wrong=cells.map((c,i)=>c.k!=="ok"?i+1:0).filter(Boolean);
    return {rank:rankOf(list,p.id),name:p.name,score:p.s,right:Q.length-wrong.length,cells,wrong};
  });
}
function resultsCard(run){
  const rows=resultData(run);
  return `<div class="card slide-up" style="animation-delay:3.4s;display:flex;flex-direction:column;gap:12px">
    <div class="foot"><h2 class="hd" style="font-size:30px">전체 결과 <span class="muted" style="font-family:'Noto Sans KR';font-size:17px">⭕ 맞힘 · ✗ 틀림(고른 보기 번호) · — 답 안 함</span></h2>
      <button class="btn" id="hXlsx">📥 엑셀로 내려받기</button></div>
    <div class="rtable-wrap"><table class="rtable">
      <thead><tr><th>순위</th><th>이름</th><th>총점</th><th>맞힌 수</th>${Q.map((_,i)=>`<th>${i+1}</th>`).join("")}<th>틀린 문제</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><b>${r.rank}</b></td><td class="nm">${esc(r.name)}</td><td>${r.score.toLocaleString()}</td><td>${r.right} / ${Q.length}</td>
        ${r.cells.map((c,i)=>`<td class="c-${c.k}" title="${esc((i+1)+"번: "+c.full)}">${esc(c.short)}</td>`).join("")}
        <td class="wr">${r.wrong.length?r.wrong.join(", ")+"번":"없음 🎉"}</td></tr>`).join("")||`<tr><td colspan="${Q.length+5}">참가자가 없어요.</td></tr>`}</tbody>
    </table></div></div>`;
}
let xlsxLoading=null;
function loadXlsx(){ if(window.XLSX) return Promise.resolve(true); if(xlsxLoading) return xlsxLoading;
  xlsxLoading=new Promise(res=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload=()=>res(!!window.XLSX); sc.onerror=()=>{ xlsxLoading=null; res(false) }; document.head.appendChild(sc); setTimeout(()=>res(!!window.XLSX),8000) });
  return xlsxLoading }
async function downloadResults(run){
  const rows=resultData(run), d=new Date(), stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const s1=[["순위","이름","총점","맞힌 수",...Q.map((_,i)=>(i+1)+"번"),"틀린 문제"]].concat(rows.map(r=>[r.rank,r.name,r.score,r.right,...r.cells.map(c=>c.full),r.wrong.length?r.wrong.join(", "):"없음"]));
  const s2=[["이름","문제 번호","난이도","문제","고른 답","정답"]];
  rows.forEach(r=>r.cells.forEach((c,i)=>{ if(c.k!=="ok") s2.push([r.name,i+1,Q[i].lv,Q[i].q,c.k==="none"?"답 안 함":c.pick,Q[i].o[Q[i].a]]) }));
  const pl=playersOf(run);
  const s3=[["문제 번호","난이도","문제","정답","정답률(%)","답한 사람",...["보기1","보기2","보기3","보기4"]]].concat(Q.map((q,i)=>{
    const ans=answersOf(run,i), ids=Object.keys(ans).filter(id=>pl.some(p=>p.id===id)), ok=ids.filter(id=>ans[id].c===q.a).length;
    return [i+1,q.lv,q.q,q.o[q.a],pl.length?Math.round(ok/pl.length*100):0,ids.length,...q.o.map((o,k)=>o+": "+ids.filter(id=>ans[id].c===k).length+"명")] }));
  const name="지구의운동_퀴즈결과_"+stamp;
  if(await loadXlsx()){
    const wb=XLSX.utils.book_new();
    const add=(aoa,title,cols)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=cols.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,title) };
    add(s1,"학생별 결과",[6,12,8,8,...Q.map(()=>16),16]);
    add(s2,"오답 목록",[12,9,7,60,22,22]);
    add(s3,"문항별 정답률",[9,7,60,22,10,10,20,20,20,20]);
    XLSX.writeFile(wb,name+".xlsx");
  } else {
    const csv=s1.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})); a.download=name+".csv"; a.click();
  }
}
function updateRevealCounts(qi,q,ans){
  const counts=q.o.map((_,i)=>Object.values(ans).filter(a=>a.c===i).length), maxC=Math.max(1,...counts);
  view.querySelectorAll(".opt[data-i]").forEach(o=>{ const i=+o.dataset.i;
    o.querySelector(".cnt").textContent=counts[i]+"명"; o.querySelector(".bar").style.width=(counts[i]/maxC*100)+"%" });
}
function tickHost(){
  const st=S(); if(!isHost||!st||st.phase!=="question") return;
  const q=Q[st.q], left=Math.max(0,q.t*1000-(Date.now()-(st.startedAt||Date.now())));
  const el=document.getElementById("hTimer");
  if(el){
    const sec=Math.ceil(left/1000);
    el.style.setProperty("--p",left/(q.t*1000)*100); el.querySelector("span").textContent=sec;
    el.classList.toggle("hurry",sec<=5&&left>0);
    if(sec!==lastTickSec){ lastTickSec=sec; if(sec<=5&&sec>0){ restart(el,"tock"); beep(sec===1?700:600,.06) } }
  }
  const pl=playersOf(st.run), ans=answersOf(st.run,st.q);
  const all=pl.length>0&&pl.every(p=>ans[p.id]);
  const key=st.run+":"+st.q;
  if((left<=0||all)&&autoLock!==key){ autoLock=key; setTimeout(reveal,all?700:0) }
}
async function newGame(){ await fbWrite("PUT","",{state:{run:String(Date.now()),phase:"lobby",q:0}}) }
async function goReady(i){ await fbWrite("PATCH","/state",{phase:"ready",q:i}) }
async function goQuestion(i){ await fbWrite("PATCH","/state",{phase:"question",q:i,startedAt:Date.now()}) }
async function reveal(){ const st=S(); if(st&&st.phase==="question") await fbWrite("PATCH","/state",{phase:"reveal"}) }
async function goExplain(i){ await fbWrite("PATCH","/state",{phase:"explain",q:i}) }
async function finish(){ await fbWrite("PATCH","/state",{phase:"end"}) }

function pinRender(){
  topBtns.innerHTML="";
  view.innerHTML=`<div class="center"><h1 class="hd" style="font-size:40px">진행자 화면</h1><p class="muted">비밀번호를 넣어 주세요.</p>
    <input class="name" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="비밀번호">
    <div class="err">${esc(pinErr)}</div><button class="btn" id="pinGo">들어가기</button></div>`;
  const go=()=>{ if(document.getElementById("pin").value===String(CFG.hostPin||"")){ ss.set("eq_host","1"); isHost=true; render() } else { pinErr="비밀번호가 달라요."; pinRender() } };
  document.getElementById("pinGo").onclick=go;
  document.getElementById("pin").onkeydown=e=>{ if(e.key==="Enter") go() };
  document.getElementById("pin").focus();
}

/* ===== 참가자 ===== */
let pid=ls.get("eq_pid"); if(!pid){ pid="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); ls.set("eq_pid",pid) }
let joining=false, sending=null, seenAt={}, lastPlayerKey="";

function playerRender(){
  topBtns.innerHTML="";
  const st=S();
  if(!st||!st.run){ view.innerHTML='<div class="center"><div style="font-size:64px">🌏</div><h1 class="hd" style="font-size:34px">아직 퀴즈가 열리지 않았어요</h1><p class="muted">선생님이 게임을 열면 자동으로 바뀌어요.</p></div>'; lastPlayerKey="none"; return }
  const run=st.run, mine=tree.players&&tree.players[run]&&tree.players[run][pid];
  if(!mine){
    if(lastPlayerKey==="join:"+run) return; // 입력 중인 이름 지우지 않기
    lastPlayerKey="join:"+run;
    view.innerHTML=`<div class="center"><div style="font-size:64px">🌏</div><h1 class="hd" style="font-size:38px">지구의 운동 퀴즈</h1>
      <p class="muted">이름(별명)을 넣고 들어가세요.</p>
      <input class="name" id="nm" maxlength="10" autocomplete="off" placeholder="이름" value="${esc(ls.get("eq_name")||"")}">
      <div class="err" id="jErr"></div><button class="btn" id="jGo">들어가기</button></div>`;
    const go=async()=>{
      const v=document.getElementById("nm").value.trim().slice(0,10);
      if(!v){ document.getElementById("jErr").textContent="이름을 넣어 주세요."; return }
      if(st.phase==="end"){ document.getElementById("jErr").textContent="이번 게임은 끝났어요. 다음 게임을 기다려 주세요."; return }
      if(joining) return; joining=true; ls.set("eq_name",v);
      try{ await fbWrite("PUT",`/players/${run}/${pid}`,{name:v}) }catch(e){ document.getElementById("jErr").textContent="연결이 불안정해요. 다시 눌러 주세요." }
      joining=false;
    };
    document.getElementById("jGo").onclick=go;
    document.getElementById("nm").onkeydown=e=>{ if(e.key==="Enter") go() };
    return;
  }
  const name=mine.name;
  if(st.phase==="lobby"){ setP("lobby:"+run,`<div class="center"><div class="bounce-loop" style="font-size:72px">🚀</div><h1 class="hd pop-in" style="font-size:38px">${esc(name)}, 들어왔어요!</h1><p class="muted">화면에 이름이 보이나요? 곧 시작해요.</p></div>`); return }
  const qi=st.q, q=Q[qi], k=run+":"+qi;
  if(st.phase==="ready"){ if(setP("ready:"+k,`<div class="center ready"><span class="tag big-tag drop-in">문제 ${qi+1} / ${Q.length}</span>
      <div class="count pl-ready">준비!</div><p class="muted" style="font-size:20px">큰 화면을 보세요 👀</p></div>`)) vibrate(40); return }
  if(st.phase==="question"){
    if(!seenAt[k]) seenAt[k]=Date.now();
    const my=answersOf(run,qi)[pid];
    const late=Date.now()-seenAt[k]>q.t*1000;
    if(my||sending===k){ setP("sent:"+k,`<div class="center"><div class="fly" style="font-size:72px">📨</div><h1 class="hd" style="font-size:34px">답을 보냈어요</h1><p class="muted">다른 친구들을 기다리는 중…</p></div>`); return }
    if(late){ setP("late:"+k,`<div class="center"><div style="font-size:64px">⏰</div><h1 class="hd" style="font-size:34px">시간이 끝났어요</h1></div>`); return }
    setP("q:"+k,`<div class="qhead"><span class="tag">문제 ${qi+1} / ${Q.length}</span><span class="tag lv-${q.lv}">${q.lv}</span><span class="muted" style="margin-left:auto">큰 화면의 문제를 보고 골라요</span></div>
      <div class="pl-opts ${q.type==="ox"?"ox":""}">${q.o.map((o,i)=>`<button class="o${optColor(q,i)} btn-in" style="animation-delay:${i*.07}s" data-i="${i}" aria-label="${esc(o)}">${optShape(q,i)}${q.type==="ox"?"":`<small>${esc(o)}</small>`}</button>`).join("")}</div>`);
    view.querySelectorAll(".pl-opts button").forEach(b=>b.onclick=async()=>{
      if(sending) return; sending=k; vibrate(30);
      const t=Math.min(q.t*1000,Date.now()-seenAt[k]);
      view.querySelectorAll(".pl-opts button").forEach(x=>x.classList.add(x===b?"chosen":"faded"));
      const minWait=new Promise(r=>setTimeout(r,450));
      try{ await fbWrite("PUT",`/answers/${run}/${qi}/${pid}`,{c:+b.dataset.i,t}) }catch(e){ sending=null; lastPlayerKey=""; render(); alert("답을 보내지 못했어요. 다시 눌러 주세요."); return }
      await minWait; sending=null; lastPlayerKey=""; render();
    });
    return;
  }
  if(st.phase==="reveal"||st.phase==="explain"){
    const my=answersOf(run,qi)[pid], got=pts(qi,my);
    const list=standings(run,qi), rk=rankOf(list,pid), me=list.find(p=>p.id===pid)||{s:0};
    const ok=my&&my.c===q.a;
    const changed=setP("rev:"+k+":"+rk+":"+me.s,`<div class="center ${ok?"pop-in":"shake"}" style="background:${ok?"#E3F2E8":"#FDE4E1"};border-radius:20px;padding:20px">
      <div class="res ${ok?"bounce-loop":""}">${ok?"⭕":(my?"❌":"⏰")}</div><h1 class="hd" style="font-size:40px;color:${ok?"var(--good)":"var(--bad)"}">${ok?"정답!":(my?"아쉬워요":"시간 초과")}</h1>
      <div class="pts" id="pGot">+0점</div>
      <p style="font-size:20px">정답: <b>${esc(q.o[q.a])}</b></p>
      <p class="muted" style="font-size:20px">총 ${me.s.toLocaleString()}점 · ${list.length}명 중 <b>${rk}등</b></p></div>`);
    if(changed){ if(got) countUp(document.getElementById("pGot"),got,"점","+");
      if(ok){ vibrate([40,40,80]); confetti(innerWidth/2,innerHeight*.35,90) } else vibrate(200) }
    return;
  }
  if(st.phase==="end"){
    const list=standings(run,Q.length-1), rk=rankOf(list,pid), me=list.find(p=>p.id===pid)||{s:0};
    if(setP("end:"+run+":"+rk,`<div class="center"><div class="spin-in" style="font-size:96px">${["","🥇","🥈","🥉"][rk]||"🎉"}</div><h1 class="hd" style="font-size:40px">${esc(name)}, ${rk}등!</h1>
      <p class="pts">${me.s.toLocaleString()}점</p><p class="muted">함께해 줘서 고마워요.</p></div>`)) { if(rk<=3) rain(3500); else confetti(innerWidth/2,innerHeight*.3,80) }
  }
}
function setP(key,html){ if(key===lastPlayerKey) return false; lastPlayerKey=key; view.innerHTML=html; return true }

/* ===== 시작 ===== */
function render(){
  if(isHostUrl&&!isHost) return pinRender();
  if(tree===null){ return }
  if(isHost) hostRender(); else playerRender();
}
if(!CFG.firebaseUrl||String(CFG.roomKey||"").length<12){
  view.innerHTML='<div class="center"><h1 class="hd" style="font-size:32px">설정이 비어 있어요</h1><p class="muted">config.js에 저장소 주소와 칸 이름(12자 이상)을 넣어 주세요.</p></div>';
} else {
  render(); connect();
  setInterval(()=>{ if(isHost) tickHost(); else if(S()&&S().phase==="question") { const st=S(),k=st.run+":"+st.q; if(seenAt[k]&&Date.now()-seenAt[k]>Q[st.q].t*1000) render() } },250);
}
